<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Subway Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#87ceeb;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
#game-container{position:relative;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}
#canvas-wrap{flex:1 1 0%;min-height:0;position:relative;overflow:hidden}
#canvas-wrap canvas{display:block;width:100%!important;height:100%!important}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:20}
#hud-score{font-size:clamp(22px,4.5vmin,40px);font-weight:900;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,0.7);letter-spacing:-0.5px}
#hud-coins{display:flex;align-items:center;gap:6px;font-size:clamp(15px,3vmin,26px);font-weight:700;color:#ffdd44;text-shadow:0 2px 8px rgba(0,0,0,0.6)}
/* Start overlay */
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);z-index:30;transition:opacity 0.5s;backdrop-filter:blur(4px)}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(32px,7vmin,56px);font-weight:900;color:#ff6b35;text-shadow:0 0 40px rgba(255,107,53,0.5);margin-bottom:6px;letter-spacing:-1px}
#overlay p{color:#ddd;font-size:clamp(14px,2.5vmin,20px);margin-bottom:28px}
#overlay .sub{color:#999;font-size:clamp(11px,2vmin,14px);margin-top:16px}
#start-btn{padding:16px 56px;border:none;border-radius:100px;font-size:clamp(18px,3.5vmin,28px);font-weight:800;background:linear-gradient(135deg,#ff6b35,#e84500);color:#fff;cursor:pointer;box-shadow:0 6px 32px rgba(255,107,53,0.5);transition:transform 0.1s,box-shadow 0.2s;-webkit-tap-highlight-color:transparent}
#start-btn:active{transform:scale(0.95)}
#start-btn:hover{box-shadow:0 8px 40px rgba(255,107,53,0.7)}
/* Game over */
#gameover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);z-index:30;backdrop-filter:blur(4px)}
#gameover.show{display:flex}
#gameover h1{font-size:clamp(36px,8vmin,64px);font-weight:900;color:#ff3333;margin-bottom:4px;text-shadow:0 0 30px rgba(255,50,50,0.4)}
#gameover .final-score{font-size:clamp(20px,4vmin,32px);color:#fff;margin-bottom:2px}
#gameover .final-coins{font-size:clamp(16px,3vmin,24px);color:#ffdd44;margin-bottom:24px}
#restart-btn{padding:16px 56px;border:none;border-radius:100px;font-size:clamp(18px,3.5vmin,28px);font-weight:800;background:linear-gradient(135deg,#ff6b35,#e84500);color:#fff;cursor:pointer;box-shadow:0 6px 32px rgba(255,107,53,0.5);transition:transform 0.1s;-webkit-tap-highlight-color:transparent}
#restart-btn:active{transform:scale(0.95)}
/* Tap zones */
#tap-zones{position:absolute;left:0;right:0;top:0;bottom:calc(clamp(48px,10vmin,60px)+env(safe-area-inset-bottom,0px));display:none;z-index:10;pointer-events:none;touch-action:none}
.tap-zone{flex:1 1 33.333%;pointer-events:auto;-webkit-tap-highlight-color:transparent;touch-action:none;position:relative}
.tap-zone span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,0.12);text-transform:uppercase;letter-spacing:3px;font-weight:700;pointer-events:none}
@media(pointer:coarse),(max-width:899px){#tap-zones{display:flex}}
@media(hover:hover)and(pointer:fine)and(min-width:900px){#tap-zones{display:none!important}}
/* Controls bar */
#controls-bar{height:clamp(48px,10vmin,60px);background:rgba(0,0,0,0.5);border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-around;padding:0 8px;backdrop-filter:blur(8px)}
#controls-bar button{background:rgba(255,255,255,0.08);border:none;border-radius:10px;color:#fff;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent;transition:background 0.1s}
#controls-bar button:active{background:rgba(255,255,255,0.18)}
#controls-bar .ctrl-icon{font-size:20px}
@media(hover:hover)and(pointer:fine){#controls-bar{display:none}}
</style>
</head>
<body>
<div id="game-container">
  <div id="canvas-wrap"></div>
  <div id="hud">
    <div id="hud-score">0</div>
    <div id="hud-coins"><span style="font-size:clamp(15px,3.5vmin,24px)">🪙</span> <span id="hud-coin-count">0</span></div>
  </div>
  <div id="tap-zones">
    <div class="tap-zone" id="zone-left"><span>◀</span></div>
    <div class="tap-zone" id="zone-jump"><span>▲</span></div>
    <div class="tap-zone" id="zone-right"><span>▶</span></div>
  </div>
  <div id="overlay">
    <h1>🚇 Subway Runner</h1>
    <p>Dodge trains · Collect coins · Run forever</p>
    <button id="start-btn">▶ PLAY</button>
    <div class="sub">← → swipe · ▲ centre jump</div>
  </div>
  <div id="gameover">
    <h1>GAME OVER</h1>
    <div class="final-score">Score: <span id="final-score">0</span></div>
    <div class="final-coins">🪙 <span id="final-coins">0</span></div>
    <button id="restart-btn">▶ PLAY AGAIN</button>
  </div>
  <div id="controls-bar">
    <button id="btn-left"><span class="ctrl-icon">◀</span> Left</button>
    <button id="btn-jump"><span class="ctrl-icon">▲</span> Jump</button>
    <button id="btn-right"><span class="ctrl-icon">▶</span> Right</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

// ============================================================
// CFG — Subway Surfers style
// ============================================================
const CFG = {
  // Track — wider lanes, wider corridor
  LANE_WIDTH: 2.4,
  LANE_COUNT: 3,
  SEGMENT_LENGTH: 12,
  SEGMENTS_AHEAD: 90,
  WALL_DISTANCE: 7.0,
  WALL_HEIGHT: 8.0,
  WALL_TOP_HEDGE: 0.8,

  // Single smooth curve — no double-frequency noise
  CURVE_FREQ: 0.025,
  CURVE_AMP: 4.0,
  CURVE_Y_FREQ: 0.015,
  CURVE_Y_AMP: 0.5,

  // Player
  PLAYER_SPEED: 16,
  JUMP_VELOCITY: 12,
  GRAVITY: -42,
  SWITCH_SPEED: 14,

  // Camera — lower, closer, speed feel
  CAMERA_HEIGHT: 3.5,
  CAMERA_DISTANCE: 5.0,

  // World
  TOTAL_BUILDINGS: 30,
  BUILDING_DIST: 80,

  // Gameplay
  COIN_SPACING: 7,
  OBSTACLE_SPACING: 15,
  INITIAL_SAFE_DISTANCE: 50,
};

// ============================================================
// State
// ============================================================
const state = {
  running:false, gameOver:false, score:0, coins:0,
  playerZ:0, playerX:0, targetLane:1,
playerY:0, velocityY:0, isJumping:false, lastLand:0,
  nextGenerateZ:0, segments:[], obstacles:[], coinMeshes:[],
  speed:CFG.PLAYER_SPEED, buildings:[],
  runPhase:0, wasJumping:false,
};

// ============================================================
// Scene — bright blue sky (Subway Surfers)
// ============================================================
const scene = new THREE.Scene();
const SKY_COLOR = 0x5b9ee0;
scene.background = new THREE.Color(SKY_COLOR);
scene.fog = new THREE.Fog(SKY_COLOR, 60, 140);

const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 200);
camera.position.set(0, CFG.CAMERA_HEIGHT, -CFG.CAMERA_DISTANCE);
camera.lookAt(0, 0.5, 10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

function resize(){
  const w=document.getElementById('canvas-wrap').clientWidth;
  const h=document.getElementById('canvas-wrap').clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
}
window.addEventListener('resize',resize); resize();

// ============================================================
// Lighting — warm, sunny
// ============================================================
const hemi = new THREE.HemisphereLight(0xffe8c8, 0x445566, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 1.5);
sun.position.set(12, 20, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=2; sun.shadow.camera.far=100;
sun.shadow.camera.left=-25; sun.shadow.camera.right=25;
sun.shadow.camera.top=25; sun.shadow.camera.bottom=-25;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88bbff, 0.25);
fill.position.set(-8, 10, -5);
scene.add(fill);

// ============================================================
// Single smooth trackCurve(z) — one source of truth
// ============================================================
function trackCurve(z){
  const x = Math.sin(z * CFG.CURVE_FREQ) * CFG.CURVE_AMP
          + Math.sin(z * CFG.CURVE_FREQ * 0.6) * 0.8;
  const y = Math.sin(z * CFG.CURVE_Y_FREQ) * CFG.CURVE_Y_AMP;
  const angle = Math.atan2(
    Math.sin((z+2)*CFG.CURVE_FREQ)*CFG.CURVE_AMP - Math.sin((z-2)*CFG.CURVE_FREQ)*CFG.CURVE_AMP,
    4
  ) * 0.4;
  return {x, y, angle};
}

function getLaneX(lane){ return (lane-1)*CFG.LANE_WIDTH; }

// ============================================================
// Materials — warm palette
// ============================================================
const mRoad    = new THREE.MeshStandardMaterial({color:0x9a8a6a, roughness:0.85});
const mRoadDark= new THREE.MeshStandardMaterial({color:0x7a6a50, roughness:0.85});
const mRail    = new THREE.MeshStandardMaterial({color:0x666677, roughness:0.5, metalness:0.4});
const mSleeper = new THREE.MeshStandardMaterial({color:0x5a4a3a, roughness:0.9});
const mWall    = new THREE.MeshStandardMaterial({color:0xd94f2a, roughness:0.7});
const mWallTop = new THREE.MeshStandardMaterial({color:0xc04428, roughness:0.7});
const mHedge   = new THREE.MeshStandardMaterial({color:0x3a9e5c, roughness:0.8});
const mHedgeD  = new THREE.MeshStandardMaterial({color:0x2a8a4c, roughness:0.8});
const mCoin    = new THREE.MeshStandardMaterial({color:0xffdd44, emissive:0xffcc00, emissiveIntensity:1.2, metalness:0.85, roughness:0.1});
const mGlow    = new THREE.MeshBasicMaterial({color:0xffcc44, transparent:true, opacity:0.25, side:THREE.DoubleSide});
const mObs     = new THREE.MeshStandardMaterial({color:0xff5533, roughness:0.5, metalness:0.2, emissive:0xff3300, emissiveIntensity:0.1});
const mTrain   = new THREE.MeshStandardMaterial({color:0xcc4444, roughness:0.5, metalness:0.3});
const mTrainD  = new THREE.MeshStandardMaterial({color:0x993333, roughness:0.6});
const mTrainL  = new THREE.MeshStandardMaterial({color:0xffdd88, emissive:0xffaa44, emissiveIntensity:0.15});
const mPlayer  = new THREE.MeshStandardMaterial({color:0x3388ee, roughness:0.3, metalness:0.15});
const mPlayerD = new THREE.MeshStandardMaterial({color:0x2277dd, roughness:0.4});
const mBuildW  = new THREE.MeshStandardMaterial({color:0xccddff, emissive:0x445577, emissiveIntensity:0.15});
const mBuildD  = new THREE.MeshStandardMaterial({color:0x223344});
const mGround  = new THREE.MeshStandardMaterial({color:0x6a9a5a, roughness:0.9});

// Warm building palette
const BUILD_COLORS = [0x9a8a78,0xaa9a88,0x8a7a68,0xbaaa98,0x7a8a78,0x9aaa88];

// ============================================================
// Ground
// ============================================================
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,500), mGround);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-0.3,80);
ground.receiveShadow=true;
scene.add(ground);

// ============================================================
// Buildings (one-time)
// ============================================================
function initBuildings(){
  for(let side=-1;side<=1;side+=2)
    for(let i=0;i<CFG.TOTAL_BUILDINGS;i++){
      const h=6+Math.random()*16, w=2.5+Math.random()*5, d=4+Math.random()*8;
      const z=i*CFG.BUILDING_DIST+Math.random()*30-15;
      const c=BUILD_COLORS[Math.floor(Math.random()*BUILD_COLORS.length)];
      const mat=new THREE.MeshStandardMaterial({color:c, roughness:0.75, metalness:0.05});
      const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
      const xOff=CFG.WALL_DISTANCE+2+w/2+Math.random()*4;
      b.position.set(side*xOff,h/2,z);
      b.castShadow=true; b.receiveShadow=true;
      scene.add(b); state.buildings.push(b);
      // Windows
      for(let wy=1.5;wy<h-1;wy+=2.2)
        for(let wx=-w/2+0.8;wx<=w/2-0.5;wx+=1.8){
          const lit=Math.random()<0.3;
          const wm=new THREE.MeshStandardMaterial({color:lit?0xccddff:0x223344,emissive:lit?0x445577:0,emissiveIntensity:lit?0.2:0});
          const win=new THREE.Mesh(new THREE.BoxGeometry(0.6,1.0,0.06),wm);
          win.position.set(b.position.x+wx*(side>0?1:-1),wy,b.position.z);
          scene.add(win);
        }
    }
}

// ============================================================
// Segment builder — clean, Subway Surfers style
// ============================================================
function createSegment(baseZ){
  const z=baseZ;
  const {x:cx, y:cy, angle}=trackCurve(z);
  const g=new THREE.Group();

  // Road bed — sand-brown, full width
  const road=new THREE.Mesh(new THREE.BoxGeometry(CFG.WALL_DISTANCE*2-0.6,0.35,CFG.SEGMENT_LENGTH),mRoad);
  road.position.set(0,0,0);
  road.receiveShadow=true; road.castShadow=true;
  g.add(road);

  // Darker edge strips
  for(let s=-1;s<=1;s+=2){
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.36,CFG.SEGMENT_LENGTH),mRoadDark);
    strip.position.set(s*CFG.WALL_DISTANCE*0.85,0,0);
    g.add(strip);
  }

  // Sleepers
  for(let s=-CFG.SEGMENT_LENGTH/2+1;s<CFG.SEGMENT_LENGTH/2;s+=3){
    const sl=new THREE.Mesh(new THREE.BoxGeometry(CFG.LANE_WIDTH*CFG.LANE_COUNT+1.5,0.08,0.3),mSleeper);
    sl.position.set(0,0.15,s);
    g.add(sl);
  }

  // Rails (3 lines)
  for(let l=0;l<3;l++){
    const rX=getLaneX(l);
    const r=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.12,CFG.SEGMENT_LENGTH),mRail);
    r.position.set(rX,0.22,0);
    g.add(r);
  }

  // === SOLID SLANTED WALLS ===
  for(let side=-1;side<=1;side+=2){
    const wx=side*CFG.WALL_DISTANCE;
    const lean=side*0.06;

    // Main wall — single solid panel
    const wallPanel=new THREE.Mesh(
      new THREE.BoxGeometry(0.7, CFG.WALL_HEIGHT-1.0, CFG.SEGMENT_LENGTH),
      mWall
    );
    wallPanel.position.set(wx, (CFG.WALL_HEIGHT-1)/2, 0);
    wallPanel.rotation.z=lean;
    wallPanel.receiveShadow=true; wallPanel.castShadow=true;
    g.add(wallPanel);

    // Upper wall band
    const topBand=new THREE.Mesh(
      new THREE.BoxGeometry(0.85, 0.8, CFG.SEGMENT_LENGTH),
      mWallTop
    );
    topBand.position.set(wx, CFG.WALL_HEIGHT-0.6, 0);
    topBand.rotation.z=lean;
    g.add(topBand);

    // === GREEN HEDGE on top (Subway Surfers) ===
    for(let bh=0; bh<2; bh++){
      const hm=bh%2===0?mHedge:mHedgeD;
      for(let bx=-2;bx<=2;bx++){
        const bush=new THREE.Mesh(new THREE.IcosahedronGeometry(0.6,1),hm);
        bush.position.set(
          wx+side*Math.random()*0.3,
          CFG.WALL_HEIGHT-0.2+Math.random()*0.6,
          bx*CFG.SEGMENT_LENGTH*0.2+Math.random()*0.5
        );
        bush.scale.setScalar(0.8+Math.random()*0.5);
        g.add(bush);
      }
    }
  }

  g.position.set(cx,cy,z);
  g.rotation.y=angle;
  return g;
}

// ============================================================
// Coins — aligned to trackCurve
// ============================================================
function createCoin(lane,z){
  const {x:cx, y:cy, angle}=trackCurve(z);
  const lx=getLaneX(lane);
  const d=new THREE.Group();
  const coin=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.07,12),mCoin);
  coin.rotation.x=Math.PI/2;
  coin.position.y=1.2+cy+Math.sin(z*0.4)*0.6;
  coin.castShadow=true;
  d.add(coin);
  const glow=new THREE.Mesh(new THREE.RingGeometry(0.4,0.65,12),mGlow);
  glow.rotation.x=Math.PI/2;
  glow.position.y=coin.position.y;
  glow.position.z=-0.04;
  d.add(glow);
  d.position.set(cx+lx,0,z);
  d.rotation.y=angle;
  scene.add(d);
  return d;
}

// ============================================================
// Obstacles — aligned to trackCurve
// ============================================================
function createObstacle(type,lane,z){
  const {x:cx, y:cy, angle}=trackCurve(z);
  const lx=getLaneX(lane);
  const g=new THREE.Group();
  if(type==='train'){
    const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,2.8,4.5),mTrain);
    body.position.y=1.6+cy;
    body.castShadow=true; g.add(body);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.3,4.3),mTrainD);
    roof.position.y=3.0+cy; g.add(roof);
    for(let w=-1.4;w<=1.4;w+=1.4){
      const win=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.7,0.08),mTrainL);
      win.position.set(0,2.2+cy,w); g.add(win);
    }
    for(let w=-1.8;w<=1.8;w+=1.8)
      for(let s=-1;s<=1;s+=2){
        const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.08,8),mRail);
        wh.rotation.x=Math.PI/2;
        wh.position.set(s*0.95,0.3,w); g.add(wh);
      }
  } else {
    const h=type==='high'?3.5:0.9;
    const bar=new THREE.Mesh(new THREE.BoxGeometry(1.6,h,1.2),mObs);
    bar.position.y=h/2+cy;
    bar.castShadow=true; g.add(bar);
    if(type==='high'){
      const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.12,0.05),new THREE.MeshBasicMaterial({color:0xffdd00}));
      stripe.position.set(0,h+0.08+cy,0.6); g.add(stripe);
    }
  }
  g.position.set(cx+lx,0,z);
  g.rotation.y=angle;
  scene.add(g);
  return g;
}

// ============================================================
// Sound system (Web Audio API — procedural, no files)
// ============================================================
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,dur,type='square',vol=0.15){
  try{
    initAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function playCoinSound(){playTone(880,0.08,'square',0.12);setTimeout(()=>playTone(1320,0.12,'square',0.08),50);}
function playJumpSound(){playTone(300,0.15,'sine',0.1);setTimeout(()=>playTone(500,0.1,'sine',0.06),80);}
function playLandSound(){playTone(150,0.1,'triangle',0.08);}
function playGameOverSound(){playTone(400,0.15,'sawtooth',0.12);setTimeout(()=>playTone(300,0.15,'sawtooth',0.1),150);setTimeout(()=>playTone(200,0.3,'sawtooth',0.08),300);}
function playHitSound(){playTone(200,0.2,'sawtooth',0.15);}

// ============================================================
// Player — larger, with pivot-based animation rig
// ============================================================
const playerGroup=new THREE.Group();
const playerVisual=new THREE.Group(); // separate visual root for lean/anim
playerGroup.add(playerVisual);
const SCALE=1.5;

// Torso
const pBody=new THREE.Mesh(new THREE.BoxGeometry(0.6*SCALE,0.9*SCALE,0.4*SCALE),mPlayer);
pBody.position.y=0.7*SCALE;
pBody.castShadow=true; playerVisual.add(pBody);

// Head
const pHead=new THREE.Mesh(new THREE.SphereGeometry(0.25*SCALE,8,8),mPlayerD);
pHead.position.y=1.35*SCALE; playerVisual.add(pHead);

// Arm pivots (shoulder)
const armPivotL=new THREE.Group(); armPivotL.position.set(-0.38*SCALE,1.05*SCALE,0); playerVisual.add(armPivotL);
const armPivotR=new THREE.Group(); armPivotR.position.set(0.38*SCALE,1.05*SCALE,0); playerVisual.add(armPivotR);
const armL=new THREE.Mesh(new THREE.BoxGeometry(0.1*SCALE,0.55*SCALE,0.1*SCALE),mPlayerD);
armL.position.set(0,-0.275*SCALE,0); armPivotL.add(armL);
const armR=new THREE.Mesh(new THREE.BoxGeometry(0.1*SCALE,0.55*SCALE,0.1*SCALE),mPlayerD);
armR.position.set(0,-0.275*SCALE,0); armPivotR.add(armR);

// Leg pivots (hip)
const legPivotL=new THREE.Group(); legPivotL.position.set(-0.15*SCALE,0.5*SCALE,0); playerVisual.add(legPivotL);
const legPivotR=new THREE.Group(); legPivotR.position.set(0.15*SCALE,0.5*SCALE,0); playerVisual.add(legPivotR);
const legL=new THREE.Mesh(new THREE.BoxGeometry(0.14*SCALE,0.5*SCALE,0.14*SCALE),mPlayerD);
legL.position.set(0,-0.25*SCALE,0); legPivotL.add(legL);
const legR=new THREE.Mesh(new THREE.BoxGeometry(0.14*SCALE,0.5*SCALE,0.14*SCALE),mPlayerD);
legR.position.set(0,-0.25*SCALE,0); legPivotR.add(legR);

scene.add(playerGroup);

// ============================================================
// Generation
// ============================================================
function generateAhead(){
  while(state.nextGenerateZ < state.playerZ + CFG.SEGMENTS_AHEAD*CFG.SEGMENT_LENGTH){
    const z=state.nextGenerateZ;
    const seg = createSegment(z);
    scene.add(seg);
    state.segments.push({mesh: seg, z}); // track z for cleanup

    // Coins
    if(z>CFG.INITIAL_SAFE_DISTANCE){
      for(let l=0;l<3;l++)
        if(Math.random()<0.3)
          state.coinMeshes.push(createCoin(l, z+Math.random()*CFG.SEGMENT_LENGTH-CFG.SEGMENT_LENGTH/2));
      // Arc across lanes
      if(Math.random()<0.25){
        for(let l=0;l<3;l++)
          state.coinMeshes.push(createCoin(l, z+Math.random()*4-2));
      }
    }

    // Obstacles
    if(z>CFG.INITIAL_SAFE_DISTANCE && Math.random()<0.45){
      const n=Math.random()<0.25?2:1;
      const used=[];
      for(let o=0;o<n;o++){
        let lane;
        do{lane=Math.floor(Math.random()*3);}while(used.includes(lane));
        used.push(lane);
        const type=lane===state.targetLane
          ?(Math.random()<0.4?'high':'low')
          :(Math.random()<0.3?'train':'low');
        state.obstacles.push({mesh:createObstacle(type,lane,z+o*3), z:z+o*3, lane, type});
      }
    }
    state.nextGenerateZ+=CFG.SEGMENT_LENGTH;
  }
}

function cleanupBehind(){
  const minZ=state.playerZ-80;
  while(state.segments.length>0){
    const s=state.segments[0];
    if(s.z<minZ){
      if(s.mesh) scene.remove(s.mesh);
      state.segments.shift();
    }
    else break;
  }
  while(state.obstacles.length>0 && state.obstacles[0].z<minZ){
    const o=state.obstacles.shift();
    scene.remove(o.mesh);
    o.mesh.traverse(c=>{if(c.isMesh){c.geometry?.dispose(); if(Array.isArray(c.material))c.material.forEach(m=>m.dispose()); else c.material?.dispose();}});
  }
  while(state.coinMeshes.length>0){
    const c=state.coinMeshes[0];
    const p=new THREE.Vector3(); c.getWorldPosition(p);
    if(p.z<minZ){
      scene.remove(c);
      c.traverse(ch=>{if(ch.isMesh){ch.geometry?.dispose();if(Array.isArray(ch.material))ch.material.forEach(m=>m.dispose());else ch.material?.dispose();}});
      state.coinMeshes.shift();
    } else break;
  }
}

// ============================================================
// Collisions
// ============================================================
function checkCollisions(){
  const p=new THREE.Vector3(); playerGroup.getWorldPosition(p);
  const px=p.x, pz=p.z, py=p.y;

  for(let i=0;i<state.obstacles.length;i++){
    const o=state.obstacles[i];
    const op=new THREE.Vector3(); o.mesh.getWorldPosition(op);
    const dz=Math.abs(pz-op.z), dx=Math.abs(px-op.x);
    if(dz<2.2 && dx<1.5){
      if(o.type==='low' && py>1.2) continue;
      if(o.type==='high' && py>2.8) continue;
      gameOver(); return;
    }
  }

  for(let i=state.coinMeshes.length-1;i>=0;i--){
    const c=state.coinMeshes[i];
    const cp=new THREE.Vector3(); c.getWorldPosition(cp);
    const dz=Math.abs(pz-cp.z), dx=Math.abs(px-cp.x);
    if(dz<1.5 && dx<1.0){
      scene.remove(c);
      c.traverse(ch=>{if(ch.isMesh){ch.geometry?.dispose();if(Array.isArray(ch.material))ch.material.forEach(m=>m.dispose());else ch.material?.dispose();}});
      state.coinMeshes.splice(i,1);
      state.coins++;
      playCoinSound();
      document.getElementById('hud-coin-count').textContent=state.coins;
    }
  }
}

function gameOver(){
  state.gameOver=true; state.running=false;
  playGameOverSound();
  document.getElementById('final-score').textContent=Math.floor(state.score);
  document.getElementById('final-coins').textContent=state.coins;
  document.getElementById('gameover').classList.add('show');
}

// ============================================================
// Input
// ============================================================
const keyQueue=[];
document.addEventListener('keydown',e=>{
  if(!state.running&&!state.gameOver) return;
  if(e.key==='ArrowLeft') keyQueue.push('left');
  if(e.key==='ArrowRight') keyQueue.push('right');
  if(e.key==='ArrowUp'||e.key===' ') keyQueue.push('jump');
});

function bindTap(el,action){
  if(!el)return;
  let last=0;
  const h=e=>{
    if(!state.running) return;
    const n=performance.now();
    if(n-last<120)return;
    last=n; e.preventDefault(); e.stopPropagation();
    keyQueue.push(action);
  };
  el.addEventListener('touchstart',h,{passive:false});
  el.addEventListener('pointerdown',h,{passive:false});
  el.addEventListener('mousedown',h);
}
bindTap(document.getElementById('zone-left'),'left');
bindTap(document.getElementById('zone-jump'),'jump');
bindTap(document.getElementById('zone-right'),'right');
bindTap(document.getElementById('btn-left'),'left');
bindTap(document.getElementById('btn-jump'),'jump');
bindTap(document.getElementById('btn-right'),'right');

// ============================================================
// Reset
// ============================================================
function resetGame(){
  state.segments.forEach(s=>scene.remove(s.mesh));
  state.obstacles.forEach(o=>scene.remove(o.mesh));
  state.coinMeshes.forEach(c=>scene.remove(c));
  state.segments=[]; state.obstacles=[]; state.coinMeshes=[];

  state.playerZ=0; state.playerX=0; state.targetLane=1;
  state.playerY=0; state.velocityY=0; state.isJumping=false;
  state.runPhase=0; state.wasJumping=false;
  state.score=0; state.coins=0; state.nextGenerateZ=0;
  state.speed=CFG.PLAYER_SPEED;
  state.gameOver=false; state.running=true;

  playerGroup.position.set(0,0,0);
  playerVisual.rotation.set(0,0,0);
  playerVisual.position.set(0,0,0);
  legPivotL.rotation.x=0; legPivotR.rotation.x=0;
  armPivotL.rotation.x=0; armPivotR.rotation.x=0;
  camera.position.set(0,CFG.CAMERA_HEIGHT,-CFG.CAMERA_DISTANCE);
  camera.lookAt(0,0.5,10);

  document.getElementById('hud-score').textContent='0';
  document.getElementById('hud-coin-count').textContent='0';
  document.getElementById('gameover').classList.remove('show');
  generateAhead();
}

// ============================================================
// Game loop
// ============================================================
let lastTime=0;

function animate(time){
  const dt=Math.min((time-lastTime)/1000,0.05);
  lastTime=time;

  if(state.running&&!state.gameOver) update(dt);

  // Animate coins
  state.coinMeshes.forEach(c=>{
    c.children.forEach(ch=>{
      if(ch.isMesh&&ch.geometry?.type==='CylinderGeometry') ch.rotation.z+=dt*3;
    });
  });

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}

function update(dt){
  // Input sounds
  if(keyQueue.length>0){
    const a=keyQueue.shift();
    if(a==='left'&&state.targetLane<2) state.targetLane++;
    if(a==='right'&&state.targetLane>0) state.targetLane--;
    if(a==='jump'&&!state.isJumping){state.velocityY=CFG.JUMP_VELOCITY;state.isJumping=true;playJumpSound();}
  }

  state.playerZ+=state.speed*dt;
  state.score+=state.speed*dt;

  const targetX=getLaneX(state.targetLane);
  const prevX=state.playerX;
  state.playerX+=(targetX-state.playerX)*Math.min(1,CFG.SWITCH_SPEED*dt);

  // Jump physics
  if(state.isJumping){
    state.velocityY+=CFG.GRAVITY*dt;
    state.playerY+=state.velocityY*dt;
    if(state.playerY<=0){
      state.playerY=0;state.velocityY=0;state.isJumping=false;
      playLandSound();
    }
  }

  const {x:cx, y:cy, angle}=trackCurve(state.playerZ);

  playerGroup.position.x=cx+state.playerX;
  playerGroup.position.y=cy+state.playerY;
  playerGroup.position.z=state.playerZ;
  playerGroup.rotation.y=angle;

  // === ANIMATIONS ===
  const speedRatio=state.speed/CFG.PLAYER_SPEED;
  state.runPhase+=dt*8*speedRatio;

  // Run cycle — legs swing
  const runAngle=Math.sin(state.runPhase)*0.6;
  legPivotL.rotation.x=runAngle;
  legPivotR.rotation.x=-runAngle;

  // Arms swing opposite to legs
  armPivotL.rotation.x=-runAngle*0.7;
  armPivotR.rotation.x=runAngle*0.7;

  // Jump animation — arms up, legs tucked
  if(state.isJumping){
    const jt=Math.min(state.playerY/2,1);
    armPivotL.rotation.x=-0.8*jt;
    armPivotR.rotation.x=-0.8*jt;
    legPivotL.rotation.x=0.3*jt;
    legPivotR.rotation.x=0.3*jt;
  }

  // Lane switch lean
  const leanTarget=(targetX-state.playerX)*0.6;
  playerVisual.rotation.z+=(leanTarget-playerVisual.rotation.z)*Math.min(1,8*dt);
  // Body bounce
  const bounce=Math.abs(Math.sin(state.runPhase))*0.04;
  playerVisual.position.y=bounce+(state.isJumping?state.playerY*0.3:0);

  // Track wasJumping for landing detection
  state.wasJumping=state.isJumping;

  // Camera
  const camZ=state.playerZ-CFG.CAMERA_DISTANCE;
  const {x:camX, y:camY}=trackCurve(camZ);
  camera.position.set(camX+state.playerX*0.3, CFG.CAMERA_HEIGHT+camY, camZ);
  const la=14;
  const {x:lkX, y:lkY}=trackCurve(state.playerZ+la);
  camera.lookAt(lkX+state.playerX*0.3, 0.5+lkY, state.playerZ+la);

  generateAhead();
  cleanupBehind();
  checkCollisions();

  state.speed+=0.06*dt;
  document.getElementById('hud-score').textContent=Math.floor(state.score);
}

// ============================================================
// Start
// ============================================================
document.getElementById('start-btn').addEventListener('click',()=>{
  document.getElementById('overlay').classList.add('hidden');
  initBuildings();
  resetGame();
  requestAnimationFrame(animate);
});
document.getElementById('restart-btn').addEventListener('click',resetGame);

// Initial static preview
function initStatic(){
  for(let z=-20;z<80;z+=CFG.SEGMENT_LENGTH){
    const seg=createSegment(z);
    scene.add(seg);
    state.segments.push({mesh:seg,z});
  }
  initBuildings();
  renderer.render(scene,camera);
}
initStatic();
</script>
